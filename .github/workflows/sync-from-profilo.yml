name: Sync from profilo

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Copy profilo contents
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git clone https://github.com/commmercial/profilo.git /tmp/profilo
          rsync -a --delete --exclude='.git' --exclude='.github/workflows/sync-from-profilo.yml' /tmp/profilo/ ./
          mkdir -p .github/workflows
          cp /tmp/profilo/.github/workflows/trim-background.yml .github/workflows/trim-background.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Copy profilo repository contents"
            git push origin HEAD:main
          fi
